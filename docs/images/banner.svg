<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Helios Equipment Services – Salesforce sales, service and capacity scheduling platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#0E3A6B"/>
      <stop offset="1" stop-color="#0B5CAB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.6" stop-color="#F7A531"/>
      <stop offset="1" stop-color="#F7A531" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- sun mark -->
  <g transform="translate(120 150)">
    <circle r="78" fill="url(#sun)" opacity="0.55"/>
    <circle r="34" fill="#FFC145"/>
    <g stroke="#FFC145" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-62"/><line x1="0" y1="48" x2="0" y2="62"/>
      <line x1="-48" y1="0" x2="-62" y2="0"/><line x1="48" y1="0" x2="62" y2="0"/>
      <line x1="34" y1="-34" x2="44" y2="-44"/><line x1="-34" y1="34" x2="-44" y2="44"/>
      <line x1="34" y1="34" x2="44" y2="44"/><line x1="-34" y1="-34" x2="-44" y2="-44"/>
    </g>
  </g>

  <text x="230" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">Helios Equipment Services</text>
  <text x="232" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#CFE3FF">Sales · Service · Capacity Scheduling · Agentforce — on Salesforce</text>

  <!-- pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(232 190)"><rect width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="75" y="22" text-anchor="middle" fill="#FFFFFF">Lead → Cash</text></g>
    <g transform="translate(394 190)"><rect width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="85" y="22" text-anchor="middle" fill="#FFFFFF">Case → Engineer</text></g>
    <g transform="translate(576 190)"><rect width="190" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="95" y="22" text-anchor="middle" fill="#FFFFFF">Apex fill-and-spill</text></g>
    <g transform="translate(778 190)"><rect width="150" height="34" rx="17" fill="#FFC145"/><text x="75" y="22" text-anchor="middle" fill="#0B1F3A">AI Agent ✦</text></g>
  </g>

  <!-- mini capacity grid -->
  <g transform="translate(985 70)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#CFE3FF">
    <text x="0" y="-8">Engineer capacity</text>
    <g>
      <rect x="0"   y="0" width="30" height="22" rx="4" fill="#E5534B"/><rect x="34"  y="0" width="30" height="22" rx="4" fill="#F7A531"/><rect x="68"  y="0" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/><rect x="102" y="0" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.2"/><rect x="136" y="0" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="0"   y="28" width="30" height="22" rx="4" fill="#E5534B"/><rect x="34"  y="28" width="30" height="22" rx="4" fill="#E5534B"/><rect x="68"  y="28" width="30" height="22" rx="4" fill="#F7A531"/><rect x="102" y="28" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.2"/><rect x="136" y="28" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="0"   y="56" width="30" height="22" rx="4" fill="#F7A531"/><rect x="34"  y="56" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/><rect x="68"  y="56" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/><rect x="102" y="56" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.2"/><rect x="136" y="56" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="0"   y="84" width="30" height="22" rx="4" fill="#E5534B"/><rect x="34"  y="84" width="30" height="22" rx="4" fill="#E5534B"/><rect x="68"  y="84" width="30" height="22" rx="4" fill="#E5534B"/><rect x="102" y="84" width="30" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.2"/><rect x="136" y="84" width="30" height="22" rx="4" fill="#F7A531"/>
    </g>
    <text x="15" y="124" text-anchor="middle">Mon</text><text x="49" y="124" text-anchor="middle">Tue</text><text x="83" y="124" text-anchor="middle">Wed</text><text x="117" y="124" text-anchor="middle">Hol</text><text x="151" y="124" text-anchor="middle">Fri</text>
  </g>

  <text x="232" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9DBCE0">Benelux · Nordics · DACH · UK &amp; Ireland</text>
</svg>
